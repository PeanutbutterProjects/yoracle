<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yoracle</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Yoracle">
  <link rel="apple-touch-icon" href="../icon-180.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <script>
    /* Theme before first paint: saved choice, else the device setting. */
    (function () { var t = null; try { t = window.localStorage.getItem('yoracle-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') { try { t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'light'; } }
      document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <style>
/* ===== Yoracle theme: light = cream #FDFAF5, dark = #2F2F2F (cards #3A3A3A).
   Accent chartreuse #A3C14A, alerts orange #FD8A4D. Charcoal text on chartreuse fills. ===== */
:root, :root[data-theme="light"] {
  color-scheme: light;
  --page: #fdfaf5; --text: #3b3b3b; --softText: #6f685b; --heading: #3b3b3b;
  --button: #ffffff; --buttonText: #3b3b3b; --buttonSecondary: transparent; --buttonSecondaryText: #3b3b3b;
  --numbersOn: #a3c14a; --card: #ffffff; --cardBorder: #ebe4d6;
  --good: #5a7518; --warn: #c4561d; --notChecked: #6f685b; --notCheckedBg: #f3ede1;
  --newLabel: #c4561d; --newLabelBg: rgba(253,138,77,.12);
  --bar: #a3c14a; --bar2: #fd8a4d; --barExpected: #cfc8b8; --tableHead: #f3ede1; --focus: #fd8a4d;
  --accent: #a3c14a; --accentText: #5f7a1c; --onAccent: #2f2f2f; --alert: #fd8a4d;
  --chip: #f3ede1; --navbar: rgba(253,250,245,.96); --heldBg: rgba(253,138,77,.10); --hubBg: rgba(163,193,74,.22);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #2f2f2f; --text: #fdfaf5; --softText: #bdb8ae; --heading: #fdfaf5;
  --button: #3a3a3a; --buttonText: #fdfaf5; --buttonSecondaryText: #fdfaf5;
  --card: #3a3a3a; --cardBorder: #4a4a4a;
  --good: #b5d35a; --warn: #fd8a4d; --notChecked: #bdb8ae; --notCheckedBg: #454545;
  --newLabel: #fd8a4d; --newLabelBg: rgba(253,138,77,.16);
  --barExpected: #6a6a6a; --tableHead: #454545;
  --accentText: #a3c14a; --chip: #454545; --navbar: rgba(40,40,40,.97); --heldBg: rgba(253,138,77,.14);
}
:root[data-theme="dark"] .lt, :root:not([data-theme="dark"]) .dk { display: none !important; }
/* Colours come from COLOURS in Strings.html (set as CSS variables at start). */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { overscroll-behavior-y: contain; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 21px; line-height: 1.45;
  color: var(--text); background: var(--page);
}
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 120px; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.pagetitle { font-size: 20px; color: var(--softText); margin: 4px 0 8px; font-weight: 600; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.2; color: var(--heading); margin: 8px 0 10px; }
h2 { font-size: 25px; line-height: 1.25; color: var(--heading); margin: 30px 0 10px; }
h3 { font-size: 22px; margin: 0 0 6px; color: var(--heading); }
p { margin: 0 0 12px; }
.intro { font-size: 21px; color: var(--softText); margin-bottom: 16px; }
.big { font-size: 24px; font-weight: 600; }
.line { margin: 0 0 6px; }
.soft { color: var(--softText); }
.warn { color: var(--warn); font-weight: 600; }
.good { color: var(--good); }

/* Buttons: at least 56px tall, full width on a phone */
button, .btn {
  display: block; width: 100%; min-height: 60px; margin: 0 0 12px;
  padding: 14px 18px; border: 1px solid var(--cardBorder); border-radius: 14px;
  font: inherit; font-size: 22px; font-weight: 700; text-align: left;
  background: var(--button); color: var(--buttonText); cursor: pointer;
  -webkit-appearance: none; appearance: none;
}
button .sub { display: block; font-weight: 400; font-size: 20px; margin-top: 4px; opacity: .95; }
button.secondary { background: var(--buttonSecondary); color: var(--buttonSecondaryText); border: 2px solid var(--buttonSecondaryText); }
button:focus-visible, .yb:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.bar-top { display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.chips button { width: auto; min-height: 56px; margin: 0; font-size: 20px; padding: 10px 16px; text-align: center; background: var(--buttonSecondary); color: var(--buttonSecondaryText); border: 2px solid var(--buttonSecondaryText); }
.chips button.on { background: var(--accent); color: var(--onAccent); border-color: var(--accent); }
.monthnav { display: flex; gap: 10px; }
.monthnav button { text-align: center; }

/* Cards */
.card { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 14px; padding: 14px 16px; margin: 0 0 14px; }
.card p:last-child { margin-bottom: 0; }
.card ul { margin: 6px 0 0; padding-left: 24px; }
.card li { margin-bottom: 6px; }

/* A long unbroken string in an email or note must not push the page sideways. */
.card p, .card li, .card h3 { overflow-wrap: anywhere; }

/* Labels */
.nc { display: inline-block; font-size: 16px; line-height: 1.2; color: var(--notChecked); background: var(--notCheckedBg); border-radius: 6px; padding: 3px 7px; margin-left: 6px; vertical-align: 2px; font-weight: 600; white-space: nowrap; }
.newlabel { display: inline-block; font-size: 18px; font-weight: 700; color: var(--newLabel); background: var(--newLabelBg); border: 2px solid var(--newLabel); border-radius: 6px; padding: 2px 8px; margin-bottom: 6px; }
.tag { display: inline-block; font-size: 18px; font-weight: 600; background: var(--chip); border: 2px solid var(--cardBorder); border-radius: 6px; padding: 1px 8px; margin: 2px 6px 2px 0; }

/* Numbers layer */
.numbers { border-left: 6px solid var(--numbersOn); padding-left: 12px; margin: 12px 0 18px; }
.numbers h2:first-child, .numbers h3:first-child { margin-top: 4px; }
.src { font-size: 18px; color: var(--softText); margin: 4px 0 10px; }
body:not(.shownumbers) .numbers { display: none; }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 0 14px; border: 2px solid var(--cardBorder); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 20px; }
th, td { padding: 10px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--cardBorder); white-space: nowrap; }
td.wrap, th.wrap { white-space: normal; min-width: 220px; }
th:first-child, td:first-child { position: sticky; left: 0; background: var(--page); z-index: 1; border-right: 1px solid var(--cardBorder); }
th { background: var(--tableHead); color: var(--heading); font-weight: 700; }
td.num, th.num { text-align: right; }
tr.total td { font-weight: 700; border-top: 2px solid var(--heading); }
.scrollhint { font-size: 18px; color: var(--softText); margin: -6px 0 14px; }
th:first-child { background: var(--tableHead); }
tr.total td:first-child { background: var(--page); }

/* Charts (drawn as SVG, words on every bar) */
.chart { margin: 6px 0 16px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: inherit; }
.legend { font-size: 18px; color: var(--softText); }
.legend .sw { display: inline-block; width: 18px; height: 18px; border-radius: 3px; vertical-align: -3px; margin-right: 6px; }

/* v3: Why? button, contact links, group headings, approximate label */
h3.group { font-size: 20px; text-transform: none; color: var(--softText); margin: 18px 0 8px; }
h2.cardhead { margin: 0 0 10px; }
.thismonth { border: 2px solid var(--accent); }
button.whybtn { min-height: 60px; text-align: center; margin-top: 8px; }
.why { background: var(--card); border: 2px solid var(--accent); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.why button { margin: 10px 0 0; text-align: center; }
.contacts { display: block; margin: 2px 0 10px; }
a.contact { display: inline-block; text-decoration-color: var(--accent); min-height: 48px; line-height: 1.3; padding: 10px 14px; margin: 4px 8px 4px 0; font-size: 20px; font-weight: 700; color: var(--buttonSecondaryText); background: var(--buttonSecondary); border: 2px solid var(--buttonSecondaryText); border-radius: 10px; text-decoration: underline; word-break: break-all; }
.approx { font-size: 20px; font-weight: 600; color: var(--warn); background: var(--newLabelBg); border-radius: 8px; padding: 8px 12px; }
.approx-small { font-size: 20px; color: var(--warn); }
.err { background: #fde8e8; border: 2px solid #8a1c1c; color: #5c0f0f; padding: 16px; border-radius: 12px; }

/* ===== Yoracle components ===== */
.num { font-variant-numeric: tabular-nums; }
.w { color: var(--warn) !important; } .g { color: var(--good) !important; }
.yb { all: unset; box-sizing: border-box; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.ybar { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
.ybrand { flex: 1; min-width: 0; }
.ylogo { display: block; height: 34px; width: auto; margin-left: -4px; }
.ybar.big .ylogo { height: 44px; margin: -4px 0 0 -6px; }
.ysub { font-size: 13px; color: var(--softText); margin-top: -2px; }
.ytheme { display: flex; align-items: center; gap: 8px; }
.ytl { font-size: 13px; color: var(--softText); }
.ytog { display: flex; background: var(--chip); border: 1px solid var(--cardBorder); border-radius: 18px; padding: 2px; min-height: 34px; align-items: center; }
.ytog span { display: flex; align-items: center; justify-content: center; width: 36px; height: 28px; border-radius: 14px; color: var(--softText); }
.ytog[aria-checked="false"] .ysun, .ytog[aria-checked="true"] .ymoon { background: var(--accent); color: var(--onAccent); }
.ysec { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; }
.ysec h2 { margin: 0; font-size: 12.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--softText); font-weight: 600; }
.ylink { color: var(--accentText); font-size: 15px; font-weight: 600; padding: 4px 0 4px 10px; }
.yheroes { display: grid; gap: 8px; margin-top: 6px; }
.yhero { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 14px; padding: 12px; display: block; min-width: 0; }
.yhero.pa { box-shadow: inset 4px 0 0 var(--accent); } .yhero.pb { box-shadow: inset 4px 0 0 var(--alert); }
.yhero .hl { font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase; color: var(--softText); }
.yhero .hv { font: 500 30px/1.05 ui-serif, "New York", Georgia, serif; margin: 6px 0 3px; }
.yhero .hd { font-size: 13px; } .yhero .hd span { color: var(--softText); }
.yhero .hs { font-size: 11.5px; color: var(--softText); margin-top: 5px; }
.yhero .nc, .yrow .nc, .ytcard .nc, .yrr .nc { font-size: 11px; padding: 1px 5px; }
.ypanel { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 14px; overflow: hidden; margin: 0 0 8px; }
.yrow { display: grid; padding: 10px 12px; border-top: 1px solid var(--cardBorder); font-size: 15px; gap: 6px; align-items: center; }
.yrow:first-child { border-top: none; }
.yrow.yhead { font-size: 11.5px; color: var(--softText); text-transform: uppercase; letter-spacing: .6px; padding: 9px 12px; }
.yrow span:not(:first-child) { text-align: right; }
.ydata .yrow span:not(:first-child) { font-weight: 600; }
.yrow.held { background: var(--heldBg); }
.ytiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 8px; }
.ytile { background: var(--card); border: 1px solid var(--cardBorder); border-radius: 10px; padding: 9px 8px; min-width: 0; }
.ytile .l { font-size: 10.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--softText); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ytile .v { font-size: 17px; font-weight: 650; margin-top: 2px; white-space: nowrap; }
.ytile .d { font-size: 11px; color: var(--softText); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ychip { display: inline-block; font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 9px; background: var(--chip); color: var(--softText); white-space: nowrap; font-weight: 600; }
.ychip.w { background: rgba(253,138,77,.18); } .ychip.g { color: var(--good); } .ychip.v { color: var(--accentText); }
.yrr { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--cardBorder); font-size: 15px; width: 100%; }
.yrr:first-child { border-top: none; }
.yrr small { display: block; color: var(--softText); font-size: 12.5px; margin-top: 2px; }
.yfoot { text-align: center; font-size: 12.5px; color: var(--softText); margin: 22px 0 8px; }
.ysmall { font-size: 16px; }
.ychips button { font-size: 17px; min-height: 48px; }
.ytcards { display: grid; gap: 8px; margin-bottom: 8px; }
.ytcard { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; background: var(--card); border: 1px solid var(--cardBorder); border-radius: 14px; padding: 12px 14px; width: 100%; }
.ytcard .tn { font-size: 18px; font-weight: 650; } .ytcard .tr { font-size: 16px; font-weight: 600; text-align: right; }
.ytcard .tp { font-size: 14px; color: var(--softText); }
.ytcard .ychip { justify-self: end; }
.ytcard .tl { grid-column: 1 / -1; font-size: 14px; color: var(--softText); }
.ysetrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ysetrow h3 { margin: 0 0 4px; }
.yabout .yfull { display: block; width: 220px; max-width: 70%; height: auto; margin: 4px 0 10px; }
.yabout ul { font-size: 17px; }
button.back { font-size: 19px; min-height: 52px; text-align: left; }
.ynav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--navbar); border-top: 1px solid var(--cardBorder); display: flex; justify-content: center; padding: 6px 2px calc(10px + env(safe-area-inset-bottom)); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.ynav:empty { display: none; }
.ytab { flex: 1; max-width: 150px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--softText); position: relative; min-height: 52px; padding-top: 4px; text-align: center; }
.ytab.on { color: var(--accentText); font-weight: 700; }
.ytab.hub svg { background: var(--hubBg); border-radius: 10px; padding: 3px; width: 30px; height: 30px; margin-top: -3px; }
.ybadge { position: absolute; top: 0; left: calc(50% + 6px); background: var(--alert); color: var(--onAccent); font-size: 11.5px; font-weight: 700; border-radius: 9px; padding: 1px 6px; }
/* History drill-down: tap a yearly figure and what is behind it opens underneath. Big targets for a finger. */
.card ul.yyears { list-style: none; padding-left: 0; margin: 0; }
.card .yyears > li { padding: 14px 0; margin: 0; border-top: 1px solid var(--cardBorder); }
.card .yyears > li:first-child { padding-top: 2px; border-top: none; }
.card .yyears > li:last-child { padding-bottom: 2px; }
button.ydbtn { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; margin: 10px 0 0; padding: 10px 14px; font-size: 20px; font-weight: 600; border: 2px solid var(--accent); }
.ydamt { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
button.ydcell { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; width: auto; min-height: 48px; margin: 0; padding: 6px 10px; font-size: 20px; text-align: right; white-space: nowrap; border: 2px solid var(--accent); border-radius: 10px; }
button.ydbtn[aria-expanded="true"], button.ydcell[aria-expanded="true"] { background: var(--hubBg); }
.ydchev::before { content: '▸'; }
[aria-expanded="true"] .ydchev::before { content: '▾'; }
.ydrill { margin-top: 8px; padding: 10px 14px 12px; font-size: 19px; background: var(--card); border: 2px solid var(--accent); border-radius: 10px; }
.ydrill h3 { font-size: 20px; margin: 2px 0 8px; }
.ydrill h4 { font-size: 19px; margin: 16px 0 4px; color: var(--heading); }
.ydline { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--cardBorder); }
.ydval { text-align: right; font-weight: 600; white-space: nowrap; }
.ydsub { grid-column: 1 / -1; font-size: 17px; line-height: 1.35; color: var(--softText); }
.ydpart { white-space: nowrap; }
.ydfix { background: var(--heldBg); margin: 0 -8px; padding: 8px; border-radius: 6px; }
.ydtotal { font-weight: 700; border-top: 2px solid var(--heading); }
.ydtotal .ydval { font-weight: 700; }
.ydnote { margin: 12px 0 0; }
.src.ydsrc { grid-column: 1 / -1; margin: 2px 0 0; font-size: 16px; overflow-wrap: anywhere; }
body:not(.shownumbers) .ydsrc { display: none; }
/* In the table the panel stays in view while the table slides sideways. */
.ydrow td, .ydrow td:first-child { position: static; padding: 0 0 10px; text-align: left; white-space: normal; background: transparent; border-right: none; }
.ydstick { position: sticky; left: 0; width: min(calc(100vw - 58px), 700px); padding: 0 6px; }
.ydclip { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
/* Home card: "See the details ›" (8 Nov 2026) */
.yhero .hx { font-size: 12.5px; font-weight: 700; color: var(--accentText); margin-top: 7px; }
/* Why the Home number is what it is: money in, money out, result, each against the month before */
.yres-s { font-size: 21px; font-weight: 600; line-height: 1.4; margin: 4px 0 14px; }
.card.yres { padding: 4px 16px 8px; font-size: 20px; }
.yres .ydline:first-child { border-top: none; }
.yres .ydval { font-size: 21px; }
.yres .ydsub { font-weight: 400; }
.yres .yneg .ydval { color: var(--warn); } .yres .ypos .ydval { color: var(--good); }
/* Profit and loss statement: lines down, months across; the line names stay put while the months slide */
.ystmt table { font-size: 17px; }
.ystmt th, .ystmt td { padding: 8px 6px; }
.ystmt th:first-child, .ystmt td:first-child { white-space: normal; min-width: 104px; max-width: 118px; padding-left: 8px; }
.ystmt tr.ystsec td { font-size: 12.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--softText); background: var(--tableHead); font-weight: 700; padding-top: 7px; padding-bottom: 7px; }
.ystmt tr.ystsec td:first-child { background: var(--tableHead); }
@media (max-width: 380px) { .ystmt table { font-size: 16px; } }
/* "In plain words" card */
.ysimple { border: 2px solid var(--accent); }
.ysimple .line { font-size: 21px; line-height: 1.4; margin: 0; }
/* Loading screen: five cowboys on galloping horses */
.ypull { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 6px); left: 50%; transform: translate(-50%, 0); z-index: 20; background: var(--card); border: 1px solid var(--cardBorder); border-radius: 18px; padding: 8px 14px; font-size: 16px; font-weight: 600; color: var(--softText); box-shadow: 0 2px 8px rgba(0,0,0,.12); pointer-events: none; white-space: nowrap; }
.ypull.ready { color: var(--accentText); border-color: var(--accentText); }
.yrefreshfail { margin: 8px 0; }
.yriders { position: relative; height: 72px; overflow: hidden; margin-top: 6px; }
.yrider { position: absolute; left: 0; top: 10px; width: 62px; height: 54px; color: var(--text); animation: yride 4s linear infinite; animation-delay: calc(var(--i) * -0.8s); }
.yrider svg { display: block; width: 100%; height: 100%; fill: currentColor; animation: ybob .34s ease-in-out infinite alternate; }
.ylegs path, .yman, .yrein { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
.yrein { stroke-width: 1; }
.yhat { fill: var(--alert); }
.ylegs.f1 { animation: yflip .34s steps(1) infinite; } .ylegs.f2 { animation: yflip2 .34s steps(1) infinite; }
@keyframes yride { from { transform: translateX(-70px); } to { transform: translateX(100vw); } }
@keyframes ybob { from { transform: translateY(1px) rotate(-3deg); } to { transform: translateY(-5px) rotate(3deg); } }
@keyframes yflip { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes yflip2 { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .yrider, .yrider svg, .ylegs { animation: none; } .ylegs.f2 { display: none; } .yrider { left: calc(var(--i) * 19%); } }
/* Notes that explain a month, the "i" explanations, other-cost lines */
.ynotable { margin-top: 2px; }
.yb.yinfo { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; margin-left: 6px; border: 1.5px solid var(--accentText); border-radius: 50%; color: var(--accentText); font: italic 700 15px/1 Georgia, serif; vertical-align: 2px; position: relative; }
.yinfo::after { content: ''; position: absolute; inset: -10px; }
.yinfo[aria-expanded="true"] { background: var(--accent); color: var(--onAccent); border-color: var(--accent); }
.yinfobox { display: block; margin-top: 6px; padding: 10px 12px; background: var(--hubBg); border-radius: 8px; color: var(--text); font-size: 18px; font-weight: 400; line-height: 1.4; white-space: normal; text-align: left; }
.ystmt .ydrow td, .ystmt .ydrow td:first-child { max-width: none; min-width: 0; padding: 0 0 8px; }
.ycost { display: inline; text-decoration: underline dotted; text-underline-offset: 3px; }
.ycost .ydchev { margin-left: 4px; }
.ystmt tr.ycostline td { font-size: 15px; color: var(--softText); padding-top: 5px; padding-bottom: 5px; }

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

function txt(v) { return v === null || v === undefined ? '' : String(v).trim(); }

function daysBetween(a, b) { return dayNo(b) - dayNo(a); }

function dayNoPlusMonths(s, n) { var p = pd(s); return p ? Math.floor(Date.UTC(p.y, p.m - 1 + n, p.d) / 86400000) : null; }
function sortBy(rows, col) { return rows.slice().sort(function (a, c) { return txt(a[col]).localeCompare(txt(c[col])); }); }

/* Business year: starts on the month named in Settings (default October). */
function yearStartMonth() {
  var v = txt(BOOK.settings[COL.set.yearStarts]);
  if (/^\d+$/.test(v)) return Math.min(12, Math.max(1, +v));
  for (var i = 0; i < 12; i++) {
    if (STRINGS.months[i].toLowerCase() === v.toLowerCase() || STRINGS.shortMonths[i].toLowerCase() === v.toLowerCase().slice(0, 3)) return i + 1;
  }
  return 10;
}
/* The business year a date falls in, named by the calendar year it ends in. */
function bizYear(s) { var p = pd(s); if (!p) return null; var sm = yearStartMonth(); return sm === 1 ? p.y : (p.m >= sm ? p.y + 1 : p.y); }
function endMonthName() { var sm = yearStartMonth(); return STRINGS.months[(sm + 10) % 12]; }
function bizYearRange(endYear) {
  var sm = yearStartMonth();
  var startY = sm === 1 ? endYear : endYear - 1;
  var em = sm === 1 ? 12 : sm - 1;
  var lastDay = new Date(Date.UTC(endYear, em, 0)).getUTCDate();
  return STRINGS.yearRange('1 ' + STRINGS.shortMonths[sm - 1] + ' ' + startY, lastDay + ' ' + STRINGS.shortMonths[em - 1] + ' ' + endYear);
}
function thisBizYear() { return bizYear(BOOK.today); }

/* ---------------- data views ---------------- */
function partnerships() {
  return uniq([].concat(
    BOOK.partnerships.map(function (r) { return r[COL.pt.partnership]; }),
    BOOK.buildings.map(function (r) { return r[COL.b.partnership]; }),
    BOOK.rentRoll.map(function (r) { return r[COL.rr.partnership]; }),
    BOOK.payments.map(function (r) { return r[COL.pay.partnership]; })
  ));
}
function partnershipInfo(p) { return BOOK.partnerships.filter(function (r) { return same(r[COL.pt.partnership], p); })[0] || null; }
/* Owner's share as a number of percent (20 means 20%). A Sheet cell formatted as a percentage arrives as 0.2. */
function ownerSharePct(p) {
  var i = partnershipInfo(p); if (!i || !hasNum(i[COL.pt.share])) return null;
  var v = num(i[COL.pt.share]);
  return v > 0 && v <= 1 ? v * 100 : v;
}
function buildingInfo(b) { return BOOK.buildings.filter(function (r) { return same(r[COL.b.building], b); })[0] || null; }
function kindOf(b) { var i = buildingInfo(b); return i ? txt(i[COL.b.kind]) : ''; }
function isOtherKind(k) { return STRINGS.kindOther.some(function (x) { return same(x, k); }); }
function isOther(b) { return isOtherKind(kindOf(b)); }
function isMini(b) { return same(kindOf(b), STRINGS.kindMini); }
function isWarehouse(b) { return !isOther(b) && !isMini(b); }
function otherProperties() {
  return BOOK.buildings.filter(function (r) { return isOtherKind(r[COL.b.kind]); }).map(function (r) { return txt(r[COL.b.building]); });
}
function officeName(b) { var i = buildingInfo(b); return i && txt(i[COL.b.office]) ? txt(i[COL.b.office]) : txt(b); }
/* How a place is named in a sentence: "building A1", "Harbor View Apartment 7C", "the mini storage", "all buildings". */
function placeWords(b) {
  if (!txt(b)) return STRINGS.allBuildingsWord;
  if (same(b, STRINGS.unknownBuilding)) return STRINGS.unknownPlace;
  if (isOther(b)) return officeName(b);
  if (isMini(b)) return STRINGS.miniWord;
  return STRINGS.buildingWord(txt(b));
}
/* How a place is named on a button or label: "Building A1", "Harbor View Apartment 7C". */
function placeLabel(b) { if (!txt(b)) return ''; return isOther(b) ? officeName(b) : isMini(b) ? officeName(b) : SCREENS.building(txt(b)); }
function buildingRows(p) {
  return BOOK.buildings.filter(function (r) {
    var k = txt(r[COL.b.kind]);
    return !isOtherKind(k) && !same(k, STRINGS.kindMini) && (!p || same(r[COL.b.partnership], p));
  });
}
/* Warehouse buildings of a partnership (Kind Warehouse), plus any warehouse in the rent roll missing from Buildings. */
function buildingsOf(p) {
  var list = uniq(buildingRows(p).map(function (r) { return r[COL.b.building]; }));
  uniq(BOOK.rentRoll.filter(function (r) { return same(r[COL.rr.partnership], p); }).map(function (r) { return r[COL.rr.building]; }))
    .forEach(function (b) { if (list.indexOf(b) === -1 && isWarehouse(b)) list.push(b); });
  return list;
}
function partnershipOfBuilding(b) {
  var i = buildingInfo(b); if (i) return txt(i[COL.b.partnership]);
  var r = BOOK.rentRoll.filter(function (x) { return same(x[COL.rr.building], b); })[0];
  return r ? txt(r[COL.rr.partnership]) : '';
}
function rentMonths() { return uniq(BOOK.rentRoll.map(function (r) { return monthKey(r[COL.rr.month]); })).sort(); }
function latestRentMonth() { var m = rentMonths(); return m[m.length - 1] || ''; }
function units(month, p, b) {
  return BOOK.rentRoll.filter(function (r) {
    return monthKey(r[COL.rr.month]) === month && (!p || same(r[COL.rr.partnership], p)) && (!b || same(r[COL.rr.building], b));
  }).sort(function (a, c) { return txt(a[COL.rr.unit]).localeCompare(txt(c[COL.rr.unit]), undefined, { numeric: true }); });
}
/* Rent-roll rows of a partnership's warehouse buildings only (other properties have their own screen). */
function warehouseUnits(month, p) { return units(month, p).filter(function (r) { return !isOther(r[COL.rr.building]); }); }
function unitStats(rows) {
  var s = { rented: 0, all: 0, behind: 0, behindAmt: 0, rent: 0, charged: 0, sqftAll: 0, sqftRented: 0, empty: 0, ownUse: 0 };
  rows.forEach(function (r) {
    var st = txt(r[COL.rr.status]);
    if (same(st, STRINGS.statusOwnUse)) { s.ownUse++; return; }
    s.all++; s.sqftAll += num(r[COL.rr.sqft]);
    if (same(st, STRINGS.statusOccupied)) { s.rented++; s.sqftRented += num(r[COL.rr.sqft]); s.rent += num(r[COL.rr.rent]); s.charged += num(r[COL.rr.charged]); }
    if (same(st, STRINGS.statusEmpty)) s.empty++;
    if (num(r[COL.rr.behind]) > 0) { s.behind++; s.behindAmt += num(r[COL.rr.behind]); }
  });
  return s;
}
function isOpenRepair(r) { return !same(r[COL.rp.status], STRINGS.repairDone); }
function openRepairs(p, b) {
  return BOOK.repairs.filter(function (r) {
    return isOpenRepair(r) && (!p || same(r[COL.rp.partnership], p)) && (!b || same(r[COL.rp.building], b));
  }).sort(function (a, c) { return txt(a[COL.rp.raised]).localeCompare(txt(c[COL.rp.raised])); });
}
function miniFor(p) {
  var has = BOOK.buildings.some(function (r) { return same(r[COL.b.kind], STRINGS.kindMini) && same(r[COL.b.partnership], p); });
  var rows = BOOK.miniStorage.filter(function (r) { return same(r[COL.ms.partnership], p); })
    .sort(function (a, c) { return txt(a[COL.ms.month]).localeCompare(txt(c[COL.ms.month])); });
  if (!has && !rows.length) return null;
  return rows;
}
/* People: find the card for a name used in another tab (a person's Name, or the firm in "Works for"). */
function firmName(w) { return txt(w).replace(/\s*\([^)]*\)\s*$/, ''); }
function personFor(name) {
  name = txt(name); if (!name) return null;
  var exact = BOOK.people.filter(function (r) { return same(r[COL.pp.name], name); })[0];
  if (exact) return exact;
  return BOOK.people.filter(function (r) { return same(firmName(r[COL.pp.worksFor]), name); })[0] || null;
}
function telHref(phone) { return 'tel:' + txt(phone).replace(/[^0-9+]/g, ''); }
function contactLinks(r) {
  if (!r) return '';
  var out = [];
  if (txt(r[COL.pp.phone])) out.push('<a class="contact" href="' + esc(telHref(r[COL.pp.phone])) + '">' + esc(STRINGS.callLabel(txt(r[COL.pp.phone]))) + '</a>');
  if (txt(r[COL.pp.email])) out.push('<a class="contact" href="mailto:' + esc(txt(r[COL.pp.email])) + '">' + esc(STRINGS.emailLabel(txt(r[COL.pp.email]))) + '</a>');
  return out.length ? '<span class="contacts">' + out.join('') + '</span>' : '';
}
/* A line naming a person or firm, with their phone and email links underneath when People has them. */
function personLine(text, name) {
  return '<p class="line">' + esc(text) + '</p>' + contactLinks(personFor(name));
}
function newestNote(filterFn) { return newestFirst(BOOK.notes.filter(filterFn), COL.nt.date)[0] || null; }
/* A note's Unit can name several units ("103C, 103D"). */
function noteHasUnit(x, u) { return txt(x[COL.nt.unit]).split(/\s*,\s*/).some(function (v) { return same(v, u); }); }
function noteCard(n, title) {
  if (!n) return '';
  return '<div class="card">' + (title ? '<h3>' + esc(title) + '</h3>' : '') + '<p class="line">' + esc(n[COL.nt.note]) + '</p><p class="src">' + esc(STRINGS.noteBy(fmtDate(n[COL.nt.date]), txt(n[COL.nt.by]))) + '</p></div>';
}
function reportCash(r) { return txt(r[COL.mr.cash]) !== '' ? r[COL.mr.cash] : r[COL.mr.cashAlt]; }
function reportsFor(p) {
  return BOOK.reports.filter(function (r) { return same(r[COL.mr.partnership], p); })
    .sort(function (a, c) { return txt(a[COL.mr.month]).localeCompare(txt(c[COL.mr.month])); });
}
function reportMonthsFor(p) { return uniq(reportsFor(p).map(function (r) { return monthKey(r[COL.mr.month]); })).sort(); }
function latestReportMonthFor(p) { var m = reportMonthsFor(p); return m[m.length - 1] || ''; }
/* Months for which every partnership that has monthly reports has one (like-with-like totals). */
function commonReportMonths() {
  var ps = partnerships().filter(function (p) { return reportsFor(p).length; });
  if (!ps.length) return [];
  var all = uniq(BOOK.reports.map(function (r) { return monthKey(r[COL.mr.month]); })).sort();
  return all.filter(function (k) { return ps.every(function (p) { return BOOK.reports.some(function (r) { return same(r[COL.mr.partnership], p) && monthKey(r[COL.mr.month]) === k; }); }); });
}
function commonReportMonth() { var m = commonReportMonths(); return m[m.length - 1] || ''; }
function sourceLine(rows, what) {
  var seen = {}, parts = [];
  rows.forEach(function (r) {
    var d = txt(r['Source email date']), s = txt(r['Source email subject']);
    if (d) { if (seen['d' + d]) return; seen['d' + d] = 1; parts.push(STRINGS.source(what, fmtDate(d))); return; }
    // No email date (the monthly reports and mini storage rows): the book's own source words instead (8 Nov 2026).
    if (!s || seen['s' + s]) return; seen['s' + s] = 1;
    parts.push(STRINGS.otherSource(s.replace(/\.\s*$/, '')));
  });
  return parts.length ? '<p class="src">' + esc(parts.join(' ')) + nc(rows) + '</p>' : '';
}
function newestFirst(rows, col) { return rows.slice().sort(function (a, c) { return txt(c[col]).localeCompare(txt(a[col])); }); }
function partSentence(p, month) {
  var rows = warehouseUnits(month, p);
  var s = unitStats(rows);
  var o = openRepairs(p).filter(function (r) { return !isOther(r[COL.rp.building]); }).length;
  return { html: esc(STRINGS.rentedSentence(s.rented, s.all) + ' ' + STRINGS.behindSentence(s.behind) + ' ' + STRINGS.repairsSentence(o)) + nc(rows), stats: s, rows: rows, open: o };
}

/* ---------------- building blocks for screens ---------------- */
function header(title, intro, isRoot, noNumbersToggle) {
  /* Yoracle: logo + Dark mode toggle on every screen; a Back button on screens below a tab. */
  var root = isRoot || isTabRoot(state.screen);
  var h = appBar(!!isRoot && state.screen === 'start', '');
  if (!root) h += '<button class="secondary back" data-act="back">' + esc(YS.back) + '</button>';
  h += '<h1>' + esc(title) + '</h1>';
  if (intro) h += '<p class="intro">' + esc(intro) + '</p>';
  /* "Show the numbers" is no longer at the top of each screen (8 Nov 2026): what it adds sits far lower down,
     so it seemed to do nothing. It is one On/Off switch in Settings; noNumbersToggle is kept for old callers. */
  return h;
}
function footer(isRoot) {
  if (isRoot || isTabRoot(state.screen)) return '';
  return '<div style="margin-top:28px"><button class="secondary back" data-act="back">' + esc(YS.back) + '</button></div>';
}
function numbersBlock(inner) { return inner ? '<div class="numbers">' + inner + '</div>' : ''; }
function table(heads, rows, opts) {
  opts = opts || {};
  var h = '<div class="tablewrap"><table><thead><tr>';
  heads.forEach(function (x, i) { h += '<th class="' + ((opts.numCols || []).indexOf(i) !== -1 ? 'num' : '') + ((opts.wrapCols || []).indexOf(i) !== -1 ? ' wrap' : '') + '">' + esc(x) + '</th>'; });
  h += '</tr></thead><tbody>';
  rows.forEach(function (r) {
    if (r.full) { h += '<tr class="ydrow"><td colspan="' + heads.length + '"><div class="ydstick">' + r.full + '</div></td></tr>'; return; }
    h += '<tr' + (r.total ? ' class="total"' : '') + '>';
    (r.cells || r).forEach(function (c, i) {
      h += '<td class="' + ((opts.numCols || []).indexOf(i) !== -1 ? 'num' : '') + ((opts.wrapCols || []).indexOf(i) !== -1 ? ' wrap' : '') + '">' + c + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  if (heads.length > 3) h += '<p class="scrollhint">' + esc(STRINGS.scrollHint) + '</p>';
  return h;
}
/* Horizontal bar chart drawn as SVG. Every bar has its words and amount written next to it. */
function barChart(items, opts) {
  opts = opts || {};
  var W = 340, rowH = 56, top = 4;
  var max = 0;
  items.forEach(function (it) { var t = (it.parts || [it.value]).reduce(function (a, v) { return a + Math.max(0, num(v)); }, 0); if (t > max) max = t; });
  if (!max) max = 1;
  var H = top + items.length * rowH + 4;
  var s = '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(opts.title || '') + '">';
  items.forEach(function (it, i) {
    var y = top + i * rowH;
    s += '<text x="0" y="' + (y + 18) + '" font-size="17" style="fill:var(--text)">' + esc(it.label) + '</text>';
    s += '<text x="' + W + '" y="' + (y + 18) + '" font-size="17" font-weight="700" text-anchor="end" style="fill:var(--text)">' + esc(it.valueText) + '</text>';
    var x = 0;
    var parts = it.parts || [it.value];
    var colours = opts.colours || [CV.bar, CV.bar2];
    parts.forEach(function (v, j) {
      var w = Math.max(0, num(v)) / max * W;
      if (w > 0) s += '<rect x="' + x.toFixed(1) + '" y="' + (y + 26) + '" width="' + Math.max(2, w).toFixed(1) + '" height="20" rx="3" style="fill:' + colours[j % colours.length] + '"></rect>';
      x += w;
    });
    if (x === 0) s += '<rect x="0" y="' + (y + 26) + '" width="' + W + '" height="20" rx="3" style="fill:none;stroke:var(--cardBorder)" stroke-dasharray="4 4"></rect>';
  });
  s += '</svg>';
  if (opts.legend) {
    s += '<p class="legend">' + opts.legend.map(function (l, j) { return '<span class="sw" style="background:' + (opts.colours || [CV.bar, CV.bar2])[j] + '"></span>' + esc(l); }).join(' &nbsp; ') + '</p>';
  }
  return s + '</div>';
}

/* ---------------- screens ---------------- */
var screens = {};

/* This month's payment: the payments dated in the current calendar month; if there are none yet,
   the newest payment date before today. One sentence per payment, and a Why? button that opens the
   office's explanation in place. */
function thisMonthPaymentRows() {
  var mk = monthKey(BOOK.today), t = dayNo(BOOK.today);
  var rows = BOOK.payments.filter(function (r) { return monthKey(r[COL.pay.date]) === mk; });
  if (!rows.length) {
    var past = BOOK.payments.filter(function (r) { var d = dayNo(r[COL.pay.date]); return d !== null && d <= t; });
    var dates = uniq(past.map(function (r) { return r[COL.pay.date]; })).sort();
    var last = dates[dates.length - 1];
    rows = past.filter(function (r) { return txt(r[COL.pay.date]) === last; });
  }
  return sortBy(rows, COL.pay.date);
}
function thisMonthCard() {
  var rows = thisMonthPaymentRows(), t = dayNo(BOOK.today);
  var c = '<div class="card thismonth"><h2 class="cardhead">' + esc(STRINGS.thisMonthHeading) + '</h2>';
  if (!rows.length) c += '<p class="big">' + esc(STRINGS.thisMonthNothing) + '</p>';
  rows.forEach(function (r) {
    var p = txt(r[COL.pay.partnership]), amt = num(r[COL.pay.amount]), paid = same(r[COL.pay.status], STRINGS.paid);
    var what;
    if (payUndecided(r)) what = STRINGS.thisMonthUndecided(p);
    else if (isBlank(r[COL.pay.amount])) what = STRINGS.thisMonthAmountMissing(p);
    else if (Math.round(amt) === 0) what = STRINGS.thisMonthNone(p);
    else if (paid) what = STRINGS.thisMonthPaid(money(amt), p);
    else if (dayNo(r[COL.pay.date]) !== null && dayNo(r[COL.pay.date]) < t) what = STRINGS.thisMonthLate(money(amt), p);
    else what = STRINGS.thisMonthExpected(money(amt), p);
    if (same(r[COL.pay.type], STRINGS.yearEndType)) what += ' (' + STRINGS.yearEndWord + ')';
    c += '<p class="big line">' + esc(STRINGS.thisMonthLine(fmtDayMonth(r[COL.pay.date]), what)) + nc(r) + '</p>';
  });
  var whys = uniq(rows.map(function (r) { return r[COL.pay.why]; }));
  if (whys.length) {
    if (state.whyOpen) {
      c += '<div class="why" id="why"><p class="line"><strong>' + esc(STRINGS.whyHeading) + '</strong></p>';
      whys.forEach(function (w) { c += '<p class="line">' + esc(w) + '</p>'; });
      c += '<button class="secondary" data-act="why" aria-expanded="true" aria-controls="why">' + esc(STRINGS.whyClose) + '</button></div>';
    } else {
      c += '<button class="whybtn" data-act="why" aria-expanded="false" aria-controls="why">' + esc(STRINGS.whyButton) + '</button>';
    }
  }
  var rule = txt(BOOK.settings[COL.set.paymentRule]);
  if (rule) c += '<p class="soft" style="margin-top:10px">' + esc(rule) + '</p>';
  c += numbersBlock(rows.filter(function (r) { return txt(r[COL.pay.srcSubject]); }).map(function (r) { return '<p class="src">' + esc(txt(r[COL.pay.partnership]) + ': ' + STRINGS.sourceSubject(txt(r[COL.pay.srcSubject]), fmtDate(r[COL.pay.srcDate]))) + '</p>'; }).filter(function (x, i, arr) { return arr.indexOf(x) === i; }).join(''));
  return c + '</div>';
}

screens.month = function () {

  otherProperties().forEach(function (b) { h += '<button data-go="other" data-arg="' + esc(b) + '">' + esc(SCREENS.other(officeName(b))) + '<span class="sub">' + esc(STRINGS.otherPropertySub(partnershipOfBuilding(b))) + '</span></button>'; });
  h += '<h3 class="group">' + esc(STRINGS.groupMoney) + '</h3>';

  h += '<button data-go="bank">' + esc(SCREENS.bank) + '</button>';
  h += '<h3 class="group">' + esc(STRINGS.groupMore) + '</h3>';

  // Cards
  var paid = receivedPayments();
  // An expected row with Amount 0 means "no payment expected"; it is not a next payment.
  var exp = nextPaymentRows();
  h += '<h2>' + esc(SCREENS.money) + '</h2>';
  h += paymentCard(STRINGS.cardLastPayment, paid, true, STRINGS.noPaymentYet);
  h += paymentCard(STRINGS.cardNextPayment, exp, false, STRINGS.noPaymentExpected);

  var recent = newestFirst(BOOK.emails.filter(function (r) { var d = dayNo(r[COL.em.received]); return d !== null && dayNo(BOOK.today) - d <= 7 && dayNo(BOOK.today) - d >= 0; }), COL.em.received);
  h += '<div class="card"><h3>' + esc(STRINGS.cardEmails) + '</h3><p class="line">' + esc(STRINGS.emailsCount(recent.length)) + '</p>';
  if (recent.length) {

    recent.slice(0, 3).forEach(function (r) { h += '<li>' + esc(r[COL.em.subject]) + ' <span class="soft">(' + esc(fmtDate(r[COL.em.received])) + ')</span>' + (isNo(r[COL.em.reviewed]) ? ' <span class="nc">' + esc(STRINGS.newNotChecked) + '</span>' : '') + '</li>'; });

/* ---------------- A monthly report in whole cents (the figures must add up exactly) ----------------
   A blank cell is "not in the book yet" (null), never zero; a sum with a blank part is null too. */
function cellC(r, col) { return !r || isBlank(r[col]) ? null : Math.round(num(r[col]) * 100); }
function addC() { var t = 0; for (var i = 0; i < arguments.length; i++) { if (arguments[i] === null) return null; t += arguments[i]; } return t; }
function exactC(c) { return c === null ? '<span class="soft">' + esc(STRINGS.notInBook) + '</span>' : esc(moneyExact(c / 100)); }
function changeC(c) { return c === null ? '' : c > 0 ? YS.up(moneyExact(c / 100)) : c < 0 ? YS.down(moneyExact(-c / 100)) : YS.noChange; }
function repC(r) {
  var o = { rent: cellC(r, COL.mr.rent), mini: cellC(r, COL.mr.mini), other: cellC(r, COL.mr.other), out: cellC(r, COL.mr.expenses),
    repairs: cellC(r, COL.mr.repairs), fees: cellC(r, COL.mr.fees), office: cellC(r, COL.mr.officeRent), net: cellC(r, COL.mr.net) };
  o.inn = addC(o.rent, o.mini, o.other);
  var named = addC(o.repairs, o.fees, o.office);
  o.rest = o.out === null || named === null ? null : o.out - named;            // "All other costs": our subtraction, labelled on screen
  o.gap = o.inn === null || o.out === null || o.net === null ? null : o.inn - o.out - o.net;   // 0 when the report adds up
  return o;
}
