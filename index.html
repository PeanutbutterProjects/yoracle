<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yoracle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Yoracle">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { color-scheme: light dark; --bg:#faf8f3; --ink:#1f2a24; --soft:#5b655f; --btn:#1f2a24; --btnink:#faf8f3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17201b; --ink:#f2efe6; --soft:#b5bcb6; --btn:#f2efe6; --btnink:#17201b; } }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:30rem; margin:0 auto; padding:3rem 1.25rem 2rem; text-align:center; }
  img { width:7rem; height:7rem; border-radius:1.5rem; }
  h1 { font-size:1.6rem; margin:1rem 0 1.5rem; }
  ol { text-align:left; padding-left:1.4rem; margin:0 0 1.75rem; }
  li { margin-bottom:.6rem; }
  a.open { display:block; padding:.9rem 1rem; border-radius:.75rem; background:var(--btn); color:var(--btnink); text-decoration:none; font-weight:600; }
  p.soft { color:var(--soft); font-size:.9rem; margin-top:1.25rem; }
  #door[hidden] { display:none; }
</style>
</head>
<body>
<main id="door" hidden>
  <img src="icon-512.png" alt="">
  <h1>Yoracle</h1>
  <ol>
    <li>In Safari, tap the Share button.</li>
    <li>Tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li>
    <li>From now on, open Yoracle from its icon on your Home Screen.</li>
  </ol>
  <a class="open" id="open" href="#">Open Yoracle now</a>
  <p class="soft">On an Android phone, use the browser menu and choose Add to Home screen.</p>
</main>
<script>
/* The front door: it only carries the icon and opens the app. It holds no data.
   First visit: shows the steps and quietly marks the address, so the icon saved to the Home Screen goes straight to the app.
   Until the lock is on, APP_URL is test page A (no data); the real app link goes in only after the lock. */
var APP_URL = 'https://script.google.com/macros/s/AKfycbxzyeJSNZ3QH_ekPMO9wz36fUlJNb_6LfT7gz2OeV5lRL_5u-fChBN14ybbpyF6HHva/exec';
var fromIcon = new URLSearchParams(location.search).get('from') === 'icon';
var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
if (fromIcon || standalone) {
  location.replace(APP_URL);
} else {
  history.replaceState(null, '', '?from=icon');
  document.getElementById('open').href = APP_URL;
  document.getElementById('door').hidden = false;
}
</script>
<noscript><p style="text-align:center;padding:2rem">Yoracle needs JavaScript turned on.</p></noscript>
</body>
</html>
